[project]
name = "supportpilot"
version = "0.1.0"
description = "AI customer-support agent: RAG, tool-calling agents, MCP, evals and guardrails"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=2.0,<4",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "langgraph>=1.0,<2",
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.0"]
tracing = ["langfuse>=4.0,<5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
